services:

  postgres:
    image: postgres:16-alpine
    container_name: boilerplate-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d appdb"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: boilerplate-api

    ports:
      - "8080:8080"

    environment:
      APP_NAME: boilerplate
      HTTP_PORT: 8080

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: appdb
      DB_SSLMODE: disable

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: