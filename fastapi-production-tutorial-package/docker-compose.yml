services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      JWT_SECRET_KEY: local-only-change-me
      ENVIRONMENT: docker
      DEBUG: "false"
      CORS_ORIGINS: http://localhost:8000
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
