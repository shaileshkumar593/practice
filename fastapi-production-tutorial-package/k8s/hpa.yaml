apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: fastapi-api, namespace: fastapi}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: fastapi-api}
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
