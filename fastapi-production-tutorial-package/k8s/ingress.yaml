apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: fastapi-ingress, namespace: fastapi}
spec:
  ingressClassName: nginx
  rules:
  - host: api.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: fastapi-service, port: {number: 80}}
