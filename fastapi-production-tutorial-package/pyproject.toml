[project]
name = "fastapi-production-tutorial"
version = "1.0.0"
description = "Production-oriented FastAPI tutorial covering FastAPI, Docker, Jenkins, Kubernetes, AWS and Terraform."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.0",
    "pyjwt[crypto]>=2.8",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
    "jinja2>=3.1",
    "httpx>=0.27",
]
[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
