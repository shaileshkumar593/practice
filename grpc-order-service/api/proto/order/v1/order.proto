syntax = "proto3";

package order.v1;

option go_package = "grpc-order-service/api/gen/order/v1;orderv1";

import "google/protobuf/timestamp.proto";

service OrderService {

  rpc CreateOrder(CreateOrderRequest)
      returns (CreateOrderResponse);

  rpc GetOrder(GetOrderRequest)
      returns (GetOrderResponse);

  rpc ListOrders(ListOrdersRequest)
      returns (ListOrdersResponse);

  rpc UpdateOrder(UpdateOrderRequest)
      returns (UpdateOrderResponse);

  rpc CancelOrder(CancelOrderRequest)
      returns (CancelOrderResponse);

  rpc WatchOrders(WatchOrdersRequest)
      returns (stream OrderEvent);
}

message Order {

  string id = 1;

  string customer_id = 2;

  repeated OrderItem items = 3;

  double total_amount = 4;

  string currency = 5;

  OrderStatus status = 6;

  google.protobuf.Timestamp created_at = 7;

  google.protobuf.Timestamp updated_at = 8;
}

message OrderItem {

  string product_id = 1;

  int32 quantity = 2;

  double price = 3;
}

enum OrderStatus {

  ORDER_STATUS_UNSPECIFIED = 0;

  ORDER_STATUS_PENDING = 1;

  ORDER_STATUS_CONFIRMED = 2;

  ORDER_STATUS_CANCELLED = 3;
}

message CreateOrderRequest {

  string customer_id = 1;

  repeated OrderItem items = 2;

  string currency = 3;

  string idempotency_key = 4;
}

message CreateOrderResponse {

  Order order = 1;
}

message GetOrderRequest {

  string order_id = 1;
}

message GetOrderResponse {

  Order order = 1;
}

message ListOrdersRequest {

  string customer_id = 1;

  int32 page_size = 2;

  string page_token = 3;
}

message ListOrdersResponse {

  repeated Order orders = 1;

  string next_page_token = 2;
}

message UpdateOrderRequest {

  string order_id = 1;

  OrderStatus status = 2;
}

message UpdateOrderResponse {

  Order order = 1;
}

message CancelOrderRequest {

  string order_id = 1;
}

message CancelOrderResponse {

  Order order = 1;
}

message WatchOrdersRequest {

  string customer_id = 1;
}

message OrderEvent {

  string event_id = 1;

  string type = 2;

  Order order = 3;

  google.protobuf.Timestamp timestamp = 4;
}