services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: orders
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:8
    ports: ["6379:6379"]
  order-service:
    build: .
    depends_on: [postgres, redis]
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/orders
      REDIS_URL: redis://redis:6379
      PORT: "50051"
      ENVIRONMENT: development
    ports: ["50051:50051"]
volumes:
  postgres_data:
