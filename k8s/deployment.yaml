apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-api
  namespace: banking
spec:
  replicas: 3
  selector:
    matchLabels:
      app: banking-api
  template:
    metadata:
      labels:
        app: banking-api
    spec:
      containers:
        - name: api
          image: your-registry/rust-backend-interview:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: banking-config
            - secretRef:
                name: banking-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: banking-api
  namespace: banking
spec:
  selector:
    app: banking-api
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
