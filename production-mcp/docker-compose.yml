services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/change-me
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  mcp-server:
    build: .
    depends_on:
      - neo4j
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: change-me
      ENVIRONMENT: development
    stdin_open: true
    tty: true

volumes:
  neo4j_data:
